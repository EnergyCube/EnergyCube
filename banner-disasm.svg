<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="EnergyCube">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="1000" height="160" rx="10"/></clipPath>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4493f8"/>
      <stop offset="100%" stop-color="#4493f8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="160" fill="#0d1117"/>

    <rect x="0" y="0" width="30" height="160" fill="#010409"/>
    <line x1="30.5" y1="0" x2="30.5" y2="160" stroke="#21262d"/>

    <!-- current line band -->
    <rect x="31" y="12" width="969" height="20" fill="#1f6feb" opacity="0.16">
      <animate attributeName="y" values="12;34;56;78;100;122" calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
    </rect>

    <!-- breakpoints, flare when execution lands on them -->
    <g>
      <circle cx="15" cy="66" r="9" fill="#f85149" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.3333;0.5;1" values="0;0.3;0;0"
                 calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="66" r="4.5" fill="#8b2a26">
        <animate attributeName="fill" keyTimes="0;0.3333;0.5;1" values="#8b2a26;#ff7b72;#8b2a26;#8b2a26"
                 calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
        <animate attributeName="r" keyTimes="0;0.3333;0.5;1" values="4.5;6;4.5;4.5"
                 calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
      </circle>

      <circle cx="15" cy="110" r="9" fill="#f85149" opacity="0">
        <animate attributeName="opacity" keyTimes="0;0.6667;0.8333;1" values="0;0.3;0;0"
                 calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="110" r="4.5" fill="#8b2a26">
        <animate attributeName="fill" keyTimes="0;0.6667;0.8333;1" values="#8b2a26;#ff7b72;#8b2a26;#8b2a26"
                 calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
        <animate attributeName="r" keyTimes="0;0.6667;0.8333;1" values="4.5;6;4.5;4.5"
                 calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- instruction pointer, drawn last so it sits on top of the breakpoint -->
    <path d="M11 18 L20 22 L11 26 Z" fill="#4493f8" stroke="#0d1117" stroke-width="1.2">
      <animate attributeName="d"
        values="M11 18 L20 22 L11 26 Z;
                M11 40 L20 44 L11 48 Z;
                M11 62 L20 66 L11 70 Z;
                M11 84 L20 88 L11 92 Z;
                M11 106 L20 110 L11 114 Z;
                M11 128 L20 132 L11 136 Z"
        calcMode="discrete" dur="7.2s" repeatCount="indefinite"/>
    </path>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.4">

      <g fill="#6e7681">
        <text x="42" y="26">00401000</text>
        <text x="42" y="48">00401006</text>
        <text x="42" y="70">00401012</text>
        <text x="42" y="92">0040101E</text>
        <text x="42" y="114">0040102A</text>
        <text x="42" y="136">00401036</text>
      </g>

      <g fill="#388bfd">
        <text x="130" y="26">55 8B EC 83 EC 40 53 56 57 6A 00 68</text>
        <text x="130" y="48">65 6D 70 69 72 65 20 65 61 72 74 68</text>
        <text x="130" y="70">65 6E 65 72 67 79 63 75 62 65 42 42</text>
        <text x="130" y="92">6D 69 6E 65 63 72 61 66 74 00 CC CC</text>
        <text x="130" y="114">69 63 65 74 65 61 00 90 90 90 90 90</text>
        <text x="130" y="136">E8 3C 01 00 00 85 C0 75 12 5F 5E 5B</text>
      </g>

      <g fill="#e6edf3">
        <text x="418" y="26">push</text>
        <text x="418" y="48">mov</text>
        <text x="418" y="70">sub</text>
        <text x="418" y="92">lea</text>
        <text x="418" y="114">call</text>
        <text x="418" y="136">test</text>
      </g>

      <g fill="#79c0ff">
        <text x="470" y="26">ebp</text>
        <text x="470" y="48">ebp, esp</text>
        <text x="470" y="70">esp, 0x40</text>
        <text x="470" y="92">eax, [ebp-0x18]</text>
        <text x="470" y="114">hook_gameloop</text>
        <text x="470" y="136">eax, eax</text>
      </g>

      <g fill="#6e7681" font-style="italic">
        <text x="620" y="26">; prologue</text>
        <text x="620" y="70">; patched</text>
        <text x="620" y="114">; detour installed</text>
      </g>
    </g>

    <rect x="700" y="0" width="300" height="160" fill="url(#fade)"/>
    <text x="976" y="86" text-anchor="end"
          font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="30" font-weight="700" letter-spacing="-0.5" fill="#e6edf3">EnergyCube</text>
    <rect x="836" y="96" width="140" height="2" fill="url(#rule)" transform="rotate(180 906 97)"/>

    <rect x="0.5" y="0.5" width="999" height="159" rx="10" fill="none" stroke="#30363d"/>
  </g>
</svg>
